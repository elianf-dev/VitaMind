name: vitamind
description: A clean Flutter MVP wellness companion for mood, symptom, journal, and habit tracking.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  # Firebase BoM 4.12 is the newest set compatible with this project's
  # Xcode 16.2 toolchain. Revisit after upgrading Xcode.
  cloud_firestore: 6.3.0
  cupertino_icons: ^1.0.9
  firebase_auth: 6.4.0
  firebase_core: 4.7.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.2.0
  flutter_secure_storage: ^10.3.1
  flutter_timezone: ^5.1.0
  hive_ce_flutter: ^2.3.4
  shared_preferences: ^2.5.5
  timezone: ^0.11.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  config:
    # Xcode 16.2 cannot resolve Firebase's latest Swift 6.1 package manifest.
    # Re-enable Swift Package Manager after upgrading Xcode.
    enable-swift-package-manager: false
  uses-material-design: true
